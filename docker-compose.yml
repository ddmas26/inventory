services:
  postgres:
    image: postgres:16-alpine
    container_name: inventory-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inventory
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventory"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: inventory-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    container_name: inventory-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - mindata:/data
    healthcheck:
      # The minio image ships `mc` but not `curl`, so use the bundled client.
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    # Pulled backend image. There is no source/Dockerfile to build from on the
    # EC2 host, so set APP_IMAGE (or edit this line) to the image you pulled,
    # e.g. myrepo/inventory-api:latest.
    image: ${APP_IMAGE:-inventory-api:latest}
    container_name: inventory-api
    restart: unless-stopped
    ports:
      - "9080:9080"
    environment:
      PORT: "9080"
      # Service names resolve via the compose network; "localhost" would point
      # at the app container itself.
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: inventory
      DB_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: inventory-images
      # The browser cannot resolve the internal "minio" hostname, so the
      # publicly visible base URL is set explicitly (host-published port).
      # On EC2 set PUBLIC_HOST to the instance's public IP/DNS so the browser
      # (not this container) can load the images. Defaults to localhost for dev.
      S3_PUBLIC_BASE_URL: http://${PUBLIC_HOST:-localhost}:9000/inventory-images
      UPLOAD_DIR: /app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    # Pulled frontend image. No build context on the EC2 host, so set WEB_IMAGE
    # (or edit this line) to the image you pulled.
    image: ${WEB_IMAGE:-inventory-web:latest}
    container_name: inventory-web
    restart: unless-stopped
    ports:
      # Defaults to 3001 for local dev (Vite owns 3000); set WEB_PORT=80 on EC2.
      - "${WEB_PORT:-3001}:80"
    depends_on:
      - app

volumes:
  pgdata:
  redisdata:
  mindata:
