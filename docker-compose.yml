services:
  postgres:
    image: postgres:16-alpine
    container_name: inventory-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inventory
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventory"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: inventory-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    # Pulled backend image. There is no source/Dockerfile to build from on the
    # EC2 host, so set APP_IMAGE (or edit this line) to the image you pulled,
    # e.g. myrepo/inventory-api:latest.
    image: ${APP_IMAGE:-inventory-api:latest}
    container_name: inventory-api
    restart: unless-stopped
    ports:
      - "9080:9080"
    environment:
      PORT: "9080"
      # Service names resolve via the compose network; "localhost" would point
      # at the app container itself.
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: inventory
      DB_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # --- AWS S3 (replaces MinIO) ---
      # The bucket must already exist in AWS and allow public reads.
      S3_BUCKET: ${S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      # Do NOT set S3_ENDPOINT. Leaving it empty makes the app use real AWS S3
      # (virtual-host style) instead of MinIO (path-style).
      #
      # Credentials: on EC2 the preferred approach is to attach an IAM role to
      # the instance and leave both values unset. Otherwise set an access key.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      #
      # Optional: public base URL for images. Leave unset to let the app derive
      # https://<bucket>.s3.<region>.amazonaws.com. Set it when fronting S3 with
      # CloudFront or a custom domain.
      # S3_PUBLIC_BASE_URL: https://cdn.example.com
      #
      # Presigned URLs: with the bucket kept private, the API hands the browser a
      # short-lived signed link for each image (default 1h). Set to 0 to disable
      # presigning and serve plain public URLs instead (needs a public bucket).
      S3_PRESIGN_EXPIRY: ${S3_PRESIGN_EXPIRY:-1h}
      UPLOAD_DIR: /app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    # Pulled frontend image. No build context on the EC2 host, so set WEB_IMAGE
    # (or edit this line) to the image you pulled.
    image: ${WEB_IMAGE:-inventory-web:latest}
    container_name: inventory-web
    restart: unless-stopped
    ports:
      # Defaults to 3001 for local dev (Vite owns 3000); set WEB_PORT=80 on EC2.
      - "${WEB_PORT:-3001}:80"
    depends_on:
      - app

volumes:
  pgdata:
  redisdata:
